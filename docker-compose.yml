services:
  mysql:
    image: mysql:8.4
    container_name: eap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eap
      MYSQL_USER: eap
      MYSQL_PASSWORD: eap
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - eap_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ueap", "-peap"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  eap_mysql_data:

