server:
  port: 8080

spring:
  application:
    name: enterprise-agent-platform
  datasource:
    url: ${EAP_DB_URL:jdbc:mysql://localhost:3306/eap?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${EAP_DB_USERNAME:eap}
    password: ${EAP_DB_PASSWORD:eap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

eap:
  discovery:
    enabled: ${EAP_DISCOVERY_ENABLED:true}
    include-known-user-locations: ${EAP_DISCOVERY_INCLUDE_KNOWN_USER_LOCATIONS:true}
    scan-roots: ${EAP_DISCOVERY_SCAN_ROOTS:}
    initial-delay-ms: ${EAP_DISCOVERY_INITIAL_DELAY_MS:5000}
    interval-ms: ${EAP_DISCOVERY_INTERVAL_MS:300000}
    max-depth: ${EAP_DISCOVERY_MAX_DEPTH:6}
    max-files: ${EAP_DISCOVERY_MAX_FILES:3000}
    max-file-bytes: ${EAP_DISCOVERY_MAX_FILE_BYTES:1048576}
    max-processes: ${EAP_DISCOVERY_MAX_PROCESSES:2000}
    ingestion-token: ${EAP_DISCOVERY_INGESTION_TOKEN:}
  safety:
    gensee:
      sidecar-enabled: ${EAP_GENSEE_SIDECAR_ENABLED:false}
      sidecar-url: ${EAP_GENSEE_SIDECAR_URL:http://localhost:8787}
  telemetry:
    ingestion-token: ${EAP_TELEMETRY_INGESTION_TOKEN:}
    require-governance-preflight: ${EAP_TELEMETRY_REQUIRE_GOVERNANCE_PREFLIGHT:true}
    governance-decision-ttl-seconds: ${EAP_TELEMETRY_GOVERNANCE_DECISION_TTL_SECONDS:300}
  knowledge:
    ingestion-token: ${EAP_KNOWLEDGE_INGESTION_TOKEN:}
  management:
    ingestion-token: ${EAP_MANAGEMENT_INGESTION_TOKEN:}
  governance-data:
    ingestion-token: ${EAP_GOVERNANCE_INGESTION_TOKEN:}
    approval-token: ${EAP_GOVERNANCE_APPROVAL_TOKEN:}
    enforcement-enabled: ${EAP_GOVERNANCE_ENFORCEMENT_ENABLED:true}
    fail-closed-on-secret: ${EAP_GOVERNANCE_FAIL_CLOSED_ON_SECRET:true}
  gateway:
    enabled: ${EAP_GATEWAY_ENABLED:false}
    upstream-base-url: ${EAP_GATEWAY_UPSTREAM_BASE_URL:}
    upstream-api-key: ${EAP_GATEWAY_UPSTREAM_API_KEY:}
    ingestion-token: ${EAP_GATEWAY_INGESTION_TOKEN:}
    allow-unauthenticated: ${EAP_GATEWAY_ALLOW_UNAUTHENTICATED:false}
    auto-attribution-enabled: ${EAP_GATEWAY_AUTO_ATTRIBUTION_ENABLED:true}
    provider: ${EAP_GATEWAY_PROVIDER:openai-compatible}
    classifier: ${EAP_GATEWAY_CLASSIFIER:eap-heuristic-v1}
    connect-timeout-ms: ${EAP_GATEWAY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${EAP_GATEWAY_READ_TIMEOUT_MS:120000}
    max-payload-bytes: ${EAP_GATEWAY_MAX_PAYLOAD_BYTES:1048576}
    max-response-bytes: ${EAP_GATEWAY_MAX_RESPONSE_BYTES:4194304}
    input-cost-per-1k-tokens: ${EAP_GATEWAY_INPUT_COST_PER_1K_TOKENS:0}
    output-cost-per-1k-tokens: ${EAP_GATEWAY_OUTPUT_COST_PER_1K_TOKENS:0}
  observability:
    enabled: ${EAP_OBSERVABILITY_ENABLED:true}
    capture-mode: ${EAP_OBSERVABILITY_CAPTURE_MODE:HASH_ONLY}
    max-content-bytes: ${EAP_OBSERVABILITY_MAX_CONTENT_BYTES:65536}
    max-list-items: ${EAP_OBSERVABILITY_MAX_LIST_ITEMS:200}
    ingestion-token: ${EAP_OBSERVABILITY_INGESTION_TOKEN:}
